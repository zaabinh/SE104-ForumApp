services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-StrongPassword123!}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    volumes:
      - mssql_data:/var/opt/mssql

  db-init:
    image: se104forumapp-backend:local
    build:
      context: ./backend
    environment:
      DATABASE_URL: "${DATABASE_URL:-mssql+pyodbc://sa:StrongPassword123%21@db:1433/StudentForum?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-change-me-in-prod}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
    command: ["python", "setup_local_db.py", "--wait", "90"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: se104forumapp-backend:local
    build:
      context: ./backend
    environment:
      DATABASE_URL: "${DATABASE_URL:-mssql+pyodbc://sa:StrongPassword123%21@db:1433/StudentForum?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-change-me-in-prod}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mssql_data:
