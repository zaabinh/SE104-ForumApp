<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900">
  <defs>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #111827; }
      .node { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; rx: 14; }
      .decision { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .label { font: 600 17px Arial, sans-serif; fill: #111827; }
      .small { font: 15px Arial, sans-serif; fill: #111827; }
      .arrow { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .start { fill: #111827; }
      .end { fill: white; stroke: #111827; stroke-width: 4; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>

  <text x="500" y="42" text-anchor="middle" class="title">Activity Diagram - Tạo bài viết</text>

  <circle cx="500" cy="85" r="16" class="start"/>

  <rect x="365" y="125" width="270" height="58" class="node"/>
  <text x="500" y="160" text-anchor="middle" class="label">Nhập tiêu đề, nội dung, tag</text>

  <rect x="365" y="225" width="270" height="58" class="node"/>
  <text x="500" y="260" text-anchor="middle" class="label">Gửi yêu cầu tạo bài viết</text>

  <polygon points="500,325 620,395 500,465 380,395" class="decision"/>
  <text x="500" y="392" text-anchor="middle" class="label">Dữ liệu hợp lệ?</text>

  <rect x="90" y="365" width="230" height="58" class="node"/>
  <text x="205" y="400" text-anchor="middle" class="label">Hiển thị lỗi nhập liệu</text>

  <rect x="365" y="505" width="270" height="58" class="node"/>
  <text x="500" y="540" text-anchor="middle" class="label">Tạo slug và bản ghi bài viết</text>

  <polygon points="500,605 620,675 500,745 380,675" class="decision"/>
  <text x="500" y="670" text-anchor="middle" class="label">Người tạo là</text>
  <text x="500" y="692" text-anchor="middle" class="label">quản trị viên?</text>

  <rect x="680" y="645" width="230" height="58" class="node"/>
  <text x="795" y="680" text-anchor="middle" class="label">Đặt trạng thái active</text>

  <rect x="90" y="645" width="230" height="58" class="node"/>
  <text x="205" y="680" text-anchor="middle" class="label">Đặt trạng thái pending</text>

  <rect x="365" y="785" width="270" height="58" class="node"/>
  <text x="500" y="820" text-anchor="middle" class="label">Lưu tag và trả kết quả</text>

  <circle cx="500" cy="875" r="17" class="end"/>
  <circle cx="500" cy="875" r="9" class="start"/>

  <line x1="500" y1="101" x2="500" y2="125" class="arrow"/>
  <line x1="500" y1="183" x2="500" y2="225" class="arrow"/>
  <line x1="500" y1="283" x2="500" y2="325" class="arrow"/>
  <line x1="380" y1="395" x2="320" y2="395" class="arrow"/>
  <text x="345" y="378" text-anchor="middle" class="small">Không</text>
  <path d="M205 365 L205 154 L365 154" class="arrow"/>
  <line x1="500" y1="465" x2="500" y2="505" class="arrow"/>
  <text x="535" y="490" class="small">Có</text>
  <line x1="500" y1="563" x2="500" y2="605" class="arrow"/>
  <line x1="620" y1="675" x2="680" y2="675" class="arrow"/>
  <text x="645" y="658" text-anchor="middle" class="small">Có</text>
  <line x1="380" y1="675" x2="320" y2="675" class="arrow"/>
  <text x="350" y="658" text-anchor="middle" class="small">Không</text>
  <path d="M795 703 L795 814 L635 814" class="arrow"/>
  <path d="M205 703 L205 814 L365 814" class="arrow"/>
  <line x1="500" y1="843" x2="500" y2="858" class="arrow"/>
</svg>
