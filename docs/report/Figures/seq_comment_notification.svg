<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680">
  <defs>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #111827; }
      .label { font: 600 16px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #111827; }
      .box { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 10; }
      .line { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 8; }
      .msg { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke: #475569; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <text x="560" y="38" text-anchor="middle" class="title">Sequence Diagram - Bình luận và thông báo</text>
  <rect x="50" y="70" width="140" height="52" class="box"/><text x="120" y="102" text-anchor="middle" class="label">Người bình luận</text>
  <rect x="260" y="70" width="150" height="52" class="box"/><text x="335" y="102" text-anchor="middle" class="label">Giao diện</text>
  <rect x="485" y="70" width="150" height="52" class="box"/><text x="560" y="102" text-anchor="middle" class="label">Comment API</text>
  <rect x="710" y="70" width="150" height="52" class="box"/><text x="785" y="102" text-anchor="middle" class="label">CSDL</text>
  <rect x="930" y="70" width="140" height="52" class="box"/><text x="1000" y="102" text-anchor="middle" class="label">Tác giả bài</text>
  <line x1="120" y1="122" x2="120" y2="625" class="line"/>
  <line x1="335" y1="122" x2="335" y2="625" class="line"/>
  <line x1="560" y1="122" x2="560" y2="625" class="line"/>
  <line x1="785" y1="122" x2="785" y2="625" class="line"/>
  <line x1="1000" y1="122" x2="1000" y2="625" class="line"/>
  <line x1="120" y1="165" x2="335" y2="165" class="msg"/><text x="228" y="153" text-anchor="middle" class="small">Nhập nội dung bình luận</text>
  <line x1="335" y1="220" x2="560" y2="220" class="msg"/><text x="448" y="208" text-anchor="middle" class="small">POST /comments/</text>
  <line x1="560" y1="275" x2="785" y2="275" class="msg"/><text x="673" y="263" text-anchor="middle" class="small">Kiểm tra bài viết tồn tại</text>
  <line x1="785" y1="330" x2="560" y2="330" class="return"/><text x="673" y="318" text-anchor="middle" class="small">Thông tin bài viết</text>
  <line x1="560" y1="385" x2="785" y2="385" class="msg"/><text x="673" y="373" text-anchor="middle" class="small">Lưu comments</text>
  <line x1="560" y1="440" x2="785" y2="440" class="msg"/><text x="673" y="428" text-anchor="middle" class="small">Tạo notifications nếu cần</text>
  <line x1="560" y1="500" x2="335" y2="500" class="return"/><text x="448" y="488" text-anchor="middle" class="small">Trả bình luận mới</text>
  <line x1="1000" y1="555" x2="335" y2="555" class="msg"/><text x="668" y="543" text-anchor="middle" class="small">Tác giả xem thông báo mới</text>
</svg>
