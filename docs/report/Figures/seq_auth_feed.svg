<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <defs>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #111827; }
      .label { font: 600 17px Arial, sans-serif; fill: #111827; }
      .small { font: 15px Arial, sans-serif; fill: #111827; }
      .box { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; rx: 10; }
      .line { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 8; }
      .msg { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke: #475569; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .note { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; rx: 8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>

  <text x="550" y="38" text-anchor="middle" class="title">Sequence Diagram - Đăng nhập và xem bảng tin</text>

  <rect x="60" y="70" width="150" height="52" class="box"/>
  <text x="135" y="103" text-anchor="middle" class="label">Người dùng</text>
  <rect x="300" y="70" width="170" height="52" class="box"/>
  <text x="385" y="103" text-anchor="middle" class="label">Giao diện web</text>
  <rect x="560" y="70" width="170" height="52" class="box"/>
  <text x="645" y="103" text-anchor="middle" class="label">API Backend</text>
  <rect x="840" y="70" width="170" height="52" class="box"/>
  <text x="925" y="103" text-anchor="middle" class="label">Cơ sở dữ liệu</text>

  <line x1="135" y1="122" x2="135" y2="665" class="line"/>
  <line x1="385" y1="122" x2="385" y2="665" class="line"/>
  <line x1="645" y1="122" x2="645" y2="665" class="line"/>
  <line x1="925" y1="122" x2="925" y2="665" class="line"/>

  <line x1="135" y1="170" x2="385" y2="170" class="msg"/>
  <text x="260" y="158" text-anchor="middle" class="small">Nhập email/tên đăng nhập và mật khẩu</text>

  <line x1="385" y1="225" x2="645" y2="225" class="msg"/>
  <text x="515" y="213" text-anchor="middle" class="small">POST /auth/login</text>

  <line x1="645" y1="280" x2="925" y2="280" class="msg"/>
  <text x="785" y="268" text-anchor="middle" class="small">Tìm người dùng, kiểm tra trạng thái</text>

  <line x1="925" y1="335" x2="645" y2="335" class="return"/>
  <text x="785" y="323" text-anchor="middle" class="small">Thông tin tài khoản</text>

  <rect x="565" y="360" width="160" height="58" class="note"/>
  <text x="645" y="384" text-anchor="middle" class="small">Kiểm tra mật khẩu</text>
  <text x="645" y="404" text-anchor="middle" class="small">Tạo access/refresh token</text>

  <line x1="645" y1="450" x2="925" y2="450" class="msg"/>
  <text x="785" y="438" text-anchor="middle" class="small">Lưu refresh token vào auth_sessions</text>

  <line x1="645" y1="505" x2="385" y2="505" class="return"/>
  <text x="515" y="493" text-anchor="middle" class="small">Trả token đăng nhập</text>

  <line x1="385" y1="560" x2="645" y2="560" class="msg"/>
  <text x="515" y="548" text-anchor="middle" class="small">GET /api/posts/feed kèm access token</text>

  <line x1="645" y1="615" x2="925" y2="615" class="msg"/>
  <text x="785" y="603" text-anchor="middle" class="small">Truy vấn bài viết, tag, tương tác</text>

  <line x1="925" y1="665" x2="385" y2="665" class="return"/>
  <text x="655" y="653" text-anchor="middle" class="small">Danh sách bài viết và thông tin phân trang</text>
</svg>
