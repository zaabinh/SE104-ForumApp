<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .state { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 16; }
      .warn { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 16; }
      .end { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; rx: 16; }
      .note { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 12; }
      .label { font: 700 18px Arial, sans-serif; fill: #111827; }
      .sub { font: 14px Arial, sans-serif; fill: #374151; }
      .small { font: 14px Arial, sans-serif; fill: #111827; }
      .num { font: 700 14px Arial, sans-serif; fill: #111827; }
      .arrow { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #4b5563; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow-gray); }
      .dot { fill: #111827; }
      .badge { fill: #ffffff; stroke: #111827; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="650" y="46" text-anchor="middle" class="title">State Diagram - Trạng thái tài khoản người dùng</text>

  <circle cx="95" cy="230" r="18" class="dot"/>

  <rect x="185" y="185" width="210" height="90" class="warn"/>
  <text x="290" y="222" text-anchor="middle" class="label">Chưa xác minh</text>
  <text x="290" y="248" text-anchor="middle" class="sub">active, is_verified=false</text>

  <rect x="555" y="185" width="210" height="90" class="state"/>
  <text x="660" y="222" text-anchor="middle" class="label">Đang hoạt động</text>
  <text x="660" y="248" text-anchor="middle" class="sub">active, is_verified=true</text>

  <rect x="925" y="185" width="190" height="90" class="warn"/>
  <text x="1020" y="222" text-anchor="middle" class="label">Bị khóa</text>
  <text x="1020" y="248" text-anchor="middle" class="sub">banned</text>

  <rect x="925" y="390" width="190" height="90" class="end"/>
  <text x="1020" y="427" text-anchor="middle" class="label">Đã xóa</text>
  <text x="1020" y="453" text-anchor="middle" class="sub">deleted</text>

  <path d="M113 230 L185 230" class="arrow"/>
  <circle cx="150" cy="206" r="15" class="badge"/>
  <text x="150" y="211" text-anchor="middle" class="num">1</text>

  <path d="M395 230 L555 230" class="arrow"/>
  <circle cx="475" cy="206" r="15" class="badge"/>
  <text x="475" y="211" text-anchor="middle" class="num">2</text>

  <path d="M765 230 L925 230" class="arrow"/>
  <circle cx="845" cy="206" r="15" class="badge"/>
  <text x="845" y="211" text-anchor="middle" class="num">3</text>

  <path d="M925 260 L765 260" class="arrow"/>
  <circle cx="845" cy="284" r="15" class="badge"/>
  <text x="845" y="289" text-anchor="middle" class="num">4</text>

  <path d="M1020 275 L1020 390" class="dash"/>
  <circle cx="1052" cy="332" r="15" class="badge"/>
  <text x="1052" y="337" text-anchor="middle" class="num">5</text>

  <path d="M660 275 L660 435 L925 435" class="dash"/>
  <circle cx="660" cy="355" r="15" class="badge"/>
  <text x="660" y="360" text-anchor="middle" class="num">6</text>

  <rect x="95" y="555" width="1110" height="120" class="note"/>
  <text x="120" y="590" class="small">1. Đăng ký tài khoản local: user được tạo với status=active nhưng is_verified=false.</text>
  <text x="120" y="620" class="small">2. Người dùng xác minh email: is_verified chuyển thành true.</text>
  <text x="120" y="650" class="small">3-4. Quản trị viên khóa hoặc mở khóa tài khoản bằng Admin API.</text>
  <text x="705" y="590" class="small">5-6. Code có xử lý trạng thái deleted khi đăng nhập/truy cập.</text>
  <text x="705" y="620" class="small">Tài khoản banned/deleted không được cấp quyền sử dụng hệ thống.</text>
</svg>
