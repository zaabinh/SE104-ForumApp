<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 2100 2970" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Sơ đồ lớp dữ liệu và quan hệ giữa các bảng</title>
  <desc id="diagram-desc">Sơ đồ cơ sở dữ liệu được dàn theo chiều dọc trên khổ A4, với các connector đi qua các làn riêng để tránh chồng lấn.</desc>
  <defs>
    <style>
      .title{font:700 43px Arial,sans-serif;fill:#111827}
      .subtitle{font:22px Arial,sans-serif;fill:#475569}
      .group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:3;rx:24}
      .group-title{font:700 29px Arial,sans-serif;fill:#111827}
      .box{fill:#fff;stroke:#111827;stroke-width:2.6;rx:14}
      .h-user{fill:#dbeafe} .h-auth{fill:#e0f2fe} .h-post{fill:#dcfce7} .h-interact{fill:#fef3c7} .h-admin{fill:#fae8ff}
      .name{font:700 24px Arial,sans-serif;fill:#111827}
      .field{font:20px Arial,sans-serif;fill:#374151}
      .rel{stroke:#111827;stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
      .soft{stroke:#64748b;stroke-width:3;stroke-dasharray:12 8;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow-soft)}
      .label{font:19px Arial,sans-serif;fill:#111827;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
      .note{font:18px Arial,sans-serif;fill:#475569}
      .legend{fill:#fff;stroke:#cbd5e1;stroke-width:2.4;rx:14}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="2100" height="2970" fill="#fff"/>

  <!-- Group containers -->
  <rect x="100" y="145" width="1900" height="775" class="group"/>
  <text x="135" y="185" class="group-title">Tài khoản</text>
  <rect x="100" y="970" width="1900" height="600" class="group"/>
  <text x="135" y="1010" class="group-title">Nội dung</text>
  <rect x="100" y="1600" width="1900" height="520" class="group"/>
  <text x="135" y="1640" class="group-title">Báo cáo, thông báo và quản trị</text>
  <rect x="100" y="2160" width="1900" height="570" class="group"/>
  <text x="135" y="2200" class="group-title">Tương tác với bài viết</text>

<rect x="650" y="230" width="800" height="200" class="box"/>
<rect x="650" y="230" width="800" height="46" class="h-user"/>
<text x="1050.0" y="261" text-anchor="middle" class="name">User</text>
<text x="674" y="309" class="field">PK id</text>
<text x="674" y="337" class="field">username, email, full_name</text>
<text x="674" y="365" class="field">role, status, provider</text>
<text x="674" y="393" class="field">is_verified, interest_tags</text>
<rect x="150" y="550" width="480" height="130" class="box"/>
<rect x="150" y="550" width="480" height="46" class="h-auth"/>
<text x="390.0" y="581" text-anchor="middle" class="name">AuthSession</text>
<text x="174" y="629" class="field">PK id, FK user_id</text>
<text x="174" y="657" class="field">refresh_token, expires_at</text>
<rect x="710" y="550" width="680" height="130" class="box"/>
<rect x="710" y="550" width="680" height="46" class="h-auth"/>
<text x="1050.0" y="581" text-anchor="middle" class="name">EmailVerificationToken</text>
<text x="734" y="629" class="field">PK id, FK user_id</text>
<text x="734" y="657" class="field">token, expires_at</text>
<rect x="1470" y="550" width="480" height="130" class="box"/>
<rect x="1470" y="550" width="480" height="46" class="h-auth"/>
<text x="1710.0" y="581" text-anchor="middle" class="name">PasswordResetToken</text>
<text x="1494" y="629" class="field">PK id, FK user_id</text>
<text x="1494" y="657" class="field">token, expires_at, used_at</text>
<rect x="800" y="770" width="500" height="130" class="box"/>
<rect x="800" y="770" width="500" height="46" class="h-interact"/>
<text x="1050.0" y="801" text-anchor="middle" class="name">Follow</text>
<text x="824" y="849" class="field">PK/FK follower_id</text>
<text x="824" y="877" class="field">PK/FK following_id</text>
<rect x="620" y="1060" width="860" height="220" class="box"/>
<rect x="620" y="1060" width="860" height="46" class="h-post"/>
<text x="1050.0" y="1091" text-anchor="middle" class="name">Post</text>
<text x="644" y="1139" class="field">PK id, FK user_id</text>
<text x="644" y="1167" class="field">title, slug, content</text>
<text x="644" y="1195" class="field">status, original_post_id</text>
<text x="644" y="1223" class="field">share_caption, requested_new_tags</text>
<rect x="240" y="1410" width="430" height="120" class="box"/>
<rect x="240" y="1410" width="430" height="46" class="h-post"/>
<text x="455.0" y="1441" text-anchor="middle" class="name">Tag</text>
<text x="264" y="1489" class="field">PK id</text>
<text x="264" y="1517" class="field">name, slug</text>
<rect x="835" y="1410" width="430" height="120" class="box"/>
<rect x="835" y="1410" width="430" height="46" class="h-post"/>
<text x="1050.0" y="1441" text-anchor="middle" class="name">PostTag</text>
<text x="859" y="1489" class="field">PK/FK post_id</text>
<text x="859" y="1517" class="field">PK/FK tag_id</text>
<rect x="1430" y="1410" width="430" height="120" class="box"/>
<rect x="1430" y="1410" width="430" height="46" class="h-interact"/>
<text x="1645.0" y="1441" text-anchor="middle" class="name">Comment</text>
<text x="1454" y="1489" class="field">PK id, FK post_id, user_id</text>
<text x="1454" y="1517" class="field">parent_id, content</text>
<rect x="240" y="1690" width="720" height="150" class="box"/>
<rect x="240" y="1690" width="720" height="46" class="h-admin"/>
<text x="600.0" y="1721" text-anchor="middle" class="name">Report</text>
<text x="264" y="1769" class="field">PK id, FK reporter_id</text>
<text x="264" y="1797" class="field">post_id, comment_id, reviewed_by</text>
<text x="264" y="1825" class="field">reason, status</text>
<rect x="1120" y="1690" width="760" height="150" class="box"/>
<rect x="1120" y="1690" width="760" height="46" class="h-admin"/>
<text x="1500.0" y="1721" text-anchor="middle" class="name">Notification</text>
<text x="1144" y="1769" class="field">PK id, FK user_id, actor_id</text>
<text x="1144" y="1797" class="field">post_id, comment_id, report_id</text>
<text x="1144" y="1825" class="field">type, title, is_read</text>
<rect x="620" y="1960" width="860" height="120" class="box"/>
<rect x="620" y="1960" width="860" height="46" class="h-admin"/>
<text x="1050.0" y="1991" text-anchor="middle" class="name">AdminAuditLog</text>
<text x="644" y="2039" class="field">PK id, FK admin_user_id</text>
<text x="644" y="2067" class="field">action_type, target_type, target_id</text>
<rect x="240" y="2250" width="720" height="130" class="box"/>
<rect x="240" y="2250" width="720" height="46" class="h-interact"/>
<text x="600.0" y="2281" text-anchor="middle" class="name">PostLike</text>
<text x="264" y="2329" class="field">PK user_id, post_id</text>
<text x="264" y="2357" class="field">created_at</text>
<rect x="1140" y="2250" width="720" height="130" class="box"/>
<rect x="1140" y="2250" width="720" height="46" class="h-interact"/>
<text x="1500.0" y="2281" text-anchor="middle" class="name">Bookmark</text>
<text x="1164" y="2329" class="field">PK user_id, post_id</text>
<text x="1164" y="2357" class="field">created_at</text>
<rect x="240" y="2470" width="720" height="130" class="box"/>
<rect x="240" y="2470" width="720" height="46" class="h-interact"/>
<text x="600.0" y="2501" text-anchor="middle" class="name">PostView</text>
<text x="264" y="2549" class="field">PK id, FK post_id</text>
<text x="264" y="2577" class="field">user_id nullable</text>
<rect x="1140" y="2470" width="720" height="130" class="box"/>
<rect x="1140" y="2470" width="720" height="46" class="h-interact"/>
<text x="1500.0" y="2501" text-anchor="middle" class="name">PostShare</text>
<text x="1164" y="2549" class="field">PK id, FK post_id</text>
<text x="1164" y="2577" class="field">user_id nullable</text>

  <!-- User to account-related tables -->
  <path d="M820 430 V490 H390 V550" class="rel"/>
  <path d="M1050 430 V550" class="rel"/>
  <path d="M1280 430 V490 H1710 V550" class="rel"/>
  <path d="M1450 330 H1980 V720 H1050 V770" class="rel"/>
  <text x="1625" y="745" class="label">tự liên kết N–N</text>

  <!-- User to Post: outer right lane -->
  <path d="M1250 230 V180 H2040 V1018 H1050 V1060" class="rel"/>
  <text x="1780" y="995" class="label">1–N</text>

  <!-- Post, Tag, PostTag and Comment -->
  <path d="M1050 1280 V1410" class="rel"/>
  <path d="M670 1470 H835" class="rel"/>
  <text x="688" y="1450" class="label">N–N qua PostTag</text>
  <path d="M1450 1280 V1350 H1645 V1410" class="rel"/>

  <!-- Post to Report and Notification: two unused vertical gaps -->
  <path d="M700 1280 V1340 H120 V1670 H600 V1690" class="rel"/>
  <path d="M1340 1280 V1690" class="soft"/>
  <path d="M600 1840 V1900 H1500 V1840" class="soft"/>

  <!-- Post fan-out to interaction tables: left and right edge lanes -->
  <path d="M620 1180 H520 V1320 H80 V2230 H600 V2250" class="rel"/>
  <path d="M620 1120 H35 V2400 H600 V2470" class="rel"/>
  <path d="M1480 1180 H1580 V1320 H2020 V2230 H1500 V2250" class="rel"/>
  <path d="M1480 1120 H2065 V2400 H1500 V2470" class="rel"/>

</svg>