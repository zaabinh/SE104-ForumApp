<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .state { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; rx: 16; }
      .end { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; rx: 16; }
      .note { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 12; }
      .label { font: 700 18px Arial, sans-serif; fill: #111827; }
      .sub { font: 14px Arial, sans-serif; fill: #374151; }
      .small { font: 14px Arial, sans-serif; fill: #111827; }
      .num { font: 700 14px Arial, sans-serif; fill: #111827; }
      .arrow { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #4b5563; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow-gray); }
      .dot { fill: #111827; }
      .badge { fill: #ffffff; stroke: #111827; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="650" y="46" text-anchor="middle" class="title">State Diagram - Vòng đời bài viết</text>

  <circle cx="95" cy="230" r="18" class="dot"/>

  <rect x="185" y="185" width="190" height="90" class="state"/>
  <text x="280" y="222" text-anchor="middle" class="label">Chờ duyệt</text>
  <text x="280" y="248" text-anchor="middle" class="sub">pending</text>

  <rect x="555" y="185" width="190" height="90" class="state"/>
  <text x="650" y="222" text-anchor="middle" class="label">Đang hiển thị</text>
  <text x="650" y="248" text-anchor="middle" class="sub">active</text>

  <rect x="555" y="385" width="190" height="90" class="end"/>
  <text x="650" y="422" text-anchor="middle" class="label">Bị từ chối</text>
  <text x="650" y="448" text-anchor="middle" class="sub">rejected</text>

  <rect x="930" y="185" width="190" height="90" class="end"/>
  <text x="1025" y="222" text-anchor="middle" class="label">Bị xóa</text>
  <text x="1025" y="248" text-anchor="middle" class="sub">delete endpoint</text>

  <path d="M113 230 L185 230" class="arrow"/>
  <circle cx="150" cy="206" r="15" class="badge"/>
  <text x="150" y="211" text-anchor="middle" class="num">1</text>

  <path d="M375 230 L555 230" class="arrow"/>
  <circle cx="465" cy="206" r="15" class="badge"/>
  <text x="465" y="211" text-anchor="middle" class="num">2</text>

  <path d="M280 275 L280 430 L555 430" class="arrow"/>
  <circle cx="280" cy="355" r="15" class="badge"/>
  <text x="280" y="360" text-anchor="middle" class="num">3</text>

  <path d="M745 230 L930 230" class="arrow"/>
  <circle cx="838" cy="206" r="15" class="badge"/>
  <text x="838" y="211" text-anchor="middle" class="num">4</text>

  <path d="M745 430 L1025 430 L1025 275" class="arrow"/>
  <circle cx="885" cy="406" r="15" class="badge"/>
  <text x="885" y="411" text-anchor="middle" class="num">5</text>

  <path d="M650 385 L650 275" class="dash"/>
  <circle cx="682" cy="330" r="15" class="badge"/>
  <text x="682" y="335" text-anchor="middle" class="num">6</text>

  <path d="M375 185 L500 115 L650 185" class="dash"/>
  <circle cx="500" cy="116" r="15" class="badge"/>
  <text x="500" y="121" text-anchor="middle" class="num">7</text>

  <rect x="95" y="555" width="1110" height="135" class="note"/>
  <text x="120" y="590" class="small">1. Sinh viên tạo hoặc chỉnh sửa bài viết: bài chuyển sang trạng thái pending.</text>
  <text x="120" y="620" class="small">2. Quản trị viên duyệt bài: trạng thái chuyển thành active.</text>
  <text x="120" y="650" class="small">3. Quản trị viên từ chối bài: trạng thái chuyển thành rejected.</text>
  <text x="705" y="590" class="small">4-5. Chủ bài hoặc quản trị viên xóa bài khỏi hệ thống.</text>
  <text x="705" y="620" class="small">6. Khi bài bị từ chối được sửa lại, code đưa bài về pending.</text>
  <text x="705" y="650" class="small">7. Nếu quản trị viên tạo bài, bài có thể active ngay.</text>
</svg>
