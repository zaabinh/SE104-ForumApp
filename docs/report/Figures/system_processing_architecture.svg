<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .layer-title { font: 700 18px Arial, sans-serif; fill: #111827; }
      .box-title { font: 700 16px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #374151; }
      .tiny { font: 13px Arial, sans-serif; fill: #374151; }
      .layer { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 14; }
      .client { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; rx: 12; }
      .api { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 12; }
      .service { fill: #dcfce7; stroke: #15803d; stroke-width: 2; rx: 12; }
      .data { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 12; }
      .external { fill: #fae8ff; stroke: #a21caf; stroke-width: 2; rx: 12; }
      .arrow { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #4b5563; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow-gray); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="700" y="46" text-anchor="middle" class="title">Sơ đồ kiến trúc xử lý hệ thống</text>

  <rect x="70" y="90" width="1260" height="145" class="layer"/>
  <text x="100" y="123" class="layer-title">Tầng giao diện</text>
  <rect x="150" y="145" width="270" height="64" class="client"/>
  <text x="285" y="171" text-anchor="middle" class="box-title">Next.js App Router</text>
  <text x="285" y="194" text-anchor="middle" class="small">frontend/app</text>
  <rect x="565" y="145" width="270" height="64" class="client"/>
  <text x="700" y="171" text-anchor="middle" class="box-title">UI Components</text>
  <text x="700" y="194" text-anchor="middle" class="small">frontend/components</text>
  <rect x="980" y="145" width="270" height="64" class="client"/>
  <text x="1115" y="171" text-anchor="middle" class="box-title">API Client</text>
  <text x="1115" y="194" text-anchor="middle" class="small">axios, forumApi, adminApi</text>

  <rect x="70" y="280" width="1260" height="150" class="layer"/>
  <text x="100" y="313" class="layer-title">Tầng tiếp nhận yêu cầu</text>
  <rect x="150" y="335" width="270" height="64" class="api"/>
  <text x="285" y="361" text-anchor="middle" class="box-title">FastAPI Routers</text>
  <text x="285" y="384" text-anchor="middle" class="small">auth, post, user, admin</text>
  <rect x="565" y="335" width="270" height="64" class="api"/>
  <text x="700" y="361" text-anchor="middle" class="box-title">Kiểm tra quyền</text>
  <text x="700" y="384" text-anchor="middle" class="small">JWT, role, active, verified</text>
  <rect x="980" y="335" width="270" height="64" class="api"/>
  <text x="1115" y="361" text-anchor="middle" class="box-title">Pydantic Schemas</text>
  <text x="1115" y="384" text-anchor="middle" class="small">kiểm tra dữ liệu vào/ra</text>

  <rect x="70" y="475" width="1260" height="165" class="layer"/>
  <text x="100" y="508" class="layer-title">Tầng xử lý nghiệp vụ</text>
  <rect x="120" y="535" width="230" height="70" class="service"/>
  <text x="235" y="563" text-anchor="middle" class="box-title">Auth Service</text>
  <text x="235" y="586" text-anchor="middle" class="small">mật khẩu, token, phiên</text>
  <rect x="400" y="535" width="230" height="70" class="service"/>
  <text x="515" y="563" text-anchor="middle" class="box-title">Post Service</text>
  <text x="515" y="586" text-anchor="middle" class="small">tag, feed, trending</text>
  <rect x="680" y="535" width="230" height="70" class="service"/>
  <text x="795" y="563" text-anchor="middle" class="box-title">Notification Service</text>
  <text x="795" y="586" text-anchor="middle" class="small">thông báo hệ thống</text>
  <rect x="960" y="535" width="230" height="70" class="service"/>
  <text x="1075" y="563" text-anchor="middle" class="box-title">Gợi ý nội dung</text>
  <text x="1075" y="586" text-anchor="middle" class="small">profile, collaborative</text>

  <rect x="70" y="690" width="1260" height="145" class="layer"/>
  <text x="100" y="723" class="layer-title">Tầng dữ liệu</text>
  <rect x="150" y="745" width="270" height="64" class="data"/>
  <text x="285" y="771" text-anchor="middle" class="box-title">SQLAlchemy Models</text>
  <text x="285" y="794" text-anchor="middle" class="small">users, posts, reports...</text>
  <rect x="565" y="745" width="270" height="64" class="data"/>
  <text x="700" y="771" text-anchor="middle" class="box-title">Microsoft SQL Server</text>
  <text x="700" y="794" text-anchor="middle" class="small">lưu dữ liệu quan hệ</text>
  <rect x="980" y="745" width="270" height="64" class="external"/>
  <text x="1115" y="771" text-anchor="middle" class="box-title">Dịch vụ phụ trợ</text>
  <text x="1115" y="794" text-anchor="middle" class="small">Google OAuth, email, upload</text>

  <path d="M420 177 L565 177" class="arrow"/>
  <path d="M835 177 L980 177" class="arrow"/>
  <path d="M1115 209 L1115 335" class="arrow"/>

  <path d="M980 367 L835 367" class="arrow"/>
  <path d="M565 367 L420 367" class="arrow"/>
  <path d="M285 399 L285 535" class="arrow"/>
  <path d="M700 399 L700 535" class="arrow"/>
  <path d="M1115 399 L1075 535" class="arrow"/>

  <path d="M235 605 L235 745" class="arrow"/>
  <path d="M515 605 L515 690 L285 690 L285 745" class="arrow"/>
  <path d="M795 605 L795 690 L700 690 L700 745" class="arrow"/>
  <path d="M1075 605 L1075 745" class="arrow"/>

  <path d="M420 777 L565 777" class="arrow"/>
  <path d="M835 777 L980 777" class="dash"/>

  <path d="M565 810 C450 885, 280 885, 210 810" class="dash"/>
  <text x="385" y="884" text-anchor="middle" class="tiny">Dữ liệu trả về theo chiều ngược lại qua API client và giao diện</text>
</svg>
