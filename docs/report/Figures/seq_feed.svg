<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="620" viewBox="0 0 1050 620">
  <defs>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #111827; }
      .label { font: 600 17px Arial, sans-serif; fill: #111827; }
      .small { font: 15px Arial, sans-serif; fill: #111827; }
      .box { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 10; }
      .line { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 8; }
      .msg { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke: #475569; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .note { fill: #dcfce7; stroke: #15803d; stroke-width: 1.5; rx: 8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <text x="525" y="38" text-anchor="middle" class="title">Sequence Diagram - Xem bảng tin</text>
  <rect x="60" y="70" width="150" height="52" class="box"/><text x="135" y="103" text-anchor="middle" class="label">Người dùng</text>
  <rect x="300" y="70" width="170" height="52" class="box"/><text x="385" y="103" text-anchor="middle" class="label">Giao diện web</text>
  <rect x="560" y="70" width="170" height="52" class="box"/><text x="645" y="103" text-anchor="middle" class="label">Post API</text>
  <rect x="840" y="70" width="170" height="52" class="box"/><text x="925" y="103" text-anchor="middle" class="label">Cơ sở dữ liệu</text>
  <line x1="135" y1="122" x2="135" y2="570" class="line"/>
  <line x1="385" y1="122" x2="385" y2="570" class="line"/>
  <line x1="645" y1="122" x2="645" y2="570" class="line"/>
  <line x1="925" y1="122" x2="925" y2="570" class="line"/>
  <line x1="135" y1="170" x2="385" y2="170" class="msg"/><text x="260" y="158" text-anchor="middle" class="small">Mở bảng tin, chọn chế độ xem</text>
  <line x1="385" y1="225" x2="645" y2="225" class="msg"/><text x="515" y="213" text-anchor="middle" class="small">GET /api/posts/feed kèm access token</text>
  <rect x="565" y="252" width="160" height="60" class="note"/>
  <text x="645" y="277" text-anchor="middle" class="small">Kiểm tra người dùng</text>
  <text x="645" y="298" text-anchor="middle" class="small">đã đủ điều kiện</text>
  <line x1="645" y1="345" x2="925" y2="345" class="msg"/><text x="785" y="333" text-anchor="middle" class="small">Truy vấn bài active theo mode/sort</text>
  <line x1="645" y1="400" x2="925" y2="400" class="msg"/><text x="785" y="388" text-anchor="middle" class="small">Tính like, comment, view, bookmark</text>
  <line x1="925" y1="460" x2="645" y2="460" class="return"/><text x="785" y="448" text-anchor="middle" class="small">Danh sách bài viết và thống kê</text>
  <line x1="645" y1="515" x2="385" y2="515" class="return"/><text x="515" y="503" text-anchor="middle" class="small">Trả items và meta phân trang</text>
  <line x1="385" y1="565" x2="135" y2="565" class="return"/><text x="260" y="553" text-anchor="middle" class="small">Hiển thị bảng tin</text>
</svg>
