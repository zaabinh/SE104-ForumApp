<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="760" viewBox="0 0 1150 760">
  <defs>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #111827; }
      .label { font: 600 16px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #111827; }
      .box { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; rx: 10; }
      .line { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 8; }
      .msg { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke: #475569; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <text x="575" y="38" text-anchor="middle" class="title">Sequence Diagram - Tạo bài viết và kiểm duyệt</text>
  <rect x="45" y="72" width="130" height="52" class="box"/><text x="110" y="104" text-anchor="middle" class="label">Sinh viên</text>
  <rect x="235" y="72" width="145" height="52" class="box"/><text x="307" y="104" text-anchor="middle" class="label">Giao diện</text>
  <rect x="455" y="72" width="135" height="52" class="box"/><text x="522" y="104" text-anchor="middle" class="label">Post API</text>
  <rect x="660" y="72" width="145" height="52" class="box"/><text x="732" y="104" text-anchor="middle" class="label">Post service</text>
  <rect x="875" y="72" width="130" height="52" class="box"/><text x="940" y="104" text-anchor="middle" class="label">CSDL</text>
  <rect x="1030" y="72" width="95" height="52" class="box"/><text x="1077" y="104" text-anchor="middle" class="label">Admin</text>
  <line x1="110" y1="124" x2="110" y2="705" class="line"/>
  <line x1="307" y1="124" x2="307" y2="705" class="line"/>
  <line x1="522" y1="124" x2="522" y2="705" class="line"/>
  <line x1="732" y1="124" x2="732" y2="705" class="line"/>
  <line x1="940" y1="124" x2="940" y2="705" class="line"/>
  <line x1="1077" y1="124" x2="1077" y2="705" class="line"/>
  <line x1="110" y1="165" x2="307" y2="165" class="msg"/><text x="208" y="153" text-anchor="middle" class="small">Nhập bài viết và tag</text>
  <line x1="307" y1="215" x2="522" y2="215" class="msg"/><text x="415" y="203" text-anchor="middle" class="small">POST /api/posts/</text>
  <line x1="522" y1="265" x2="732" y2="265" class="msg"/><text x="627" y="253" text-anchor="middle" class="small">Tạo slug, tách tag</text>
  <line x1="732" y1="315" x2="940" y2="315" class="msg"/><text x="836" y="303" text-anchor="middle" class="small">Lưu bài status=pending</text>
  <line x1="940" y1="365" x2="522" y2="365" class="return"/><text x="730" y="353" text-anchor="middle" class="small">Trả bài vừa tạo</text>
  <line x1="522" y1="415" x2="307" y2="415" class="return"/><text x="415" y="403" text-anchor="middle" class="small">Hiển thị đang chờ duyệt</text>
  <line x1="1077" y1="470" x2="522" y2="470" class="msg"/><text x="800" y="458" text-anchor="middle" class="small">GET /api/admin/posts/pending</text>
  <line x1="522" y1="520" x2="940" y2="520" class="msg"/><text x="732" y="508" text-anchor="middle" class="small">Lấy danh sách bài chờ duyệt</text>
  <line x1="1077" y1="575" x2="522" y2="575" class="msg"/><text x="800" y="563" text-anchor="middle" class="small">POST /approve hoặc /reject</text>
  <line x1="522" y1="625" x2="940" y2="625" class="msg"/><text x="732" y="613" text-anchor="middle" class="small">Cập nhật status, tạo tag nếu duyệt</text>
  <line x1="522" y1="675" x2="940" y2="675" class="msg"/><text x="732" y="663" text-anchor="middle" class="small">Ghi admin_audit_logs</text>
</svg>
