<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .label { font: 600 17px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #111827; }
      .legend-title { font: 700 16px Arial, sans-serif; fill: #111827; }
      .obj { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 10; }
      .store { fill: #dcfce7; stroke: #15803d; stroke-width: 2; rx: 10; }
      .log { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 10; }
      .legend-box { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 10; }
      .arrow { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #374151; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow-gray); }
      .num-circle { fill: #ffffff; stroke: #111827; stroke-width: 2; }
      .num-text { font: 700 14px Arial, sans-serif; fill: #111827; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="700" y="46" text-anchor="middle" class="title">Collaboration Diagram - Tạo bài viết và duyệt bài</text>

  <rect x="70" y="105" width="170" height="70" class="obj"/>
  <text x="155" y="146" text-anchor="middle" class="label">Sinh viên</text>

  <rect x="330" y="105" width="190" height="70" class="obj"/>
  <text x="425" y="146" text-anchor="middle" class="label">Giao diện web</text>

  <rect x="610" y="105" width="180" height="70" class="obj"/>
  <text x="700" y="146" text-anchor="middle" class="label">Post API</text>

  <rect x="880" y="105" width="190" height="70" class="obj"/>
  <text x="975" y="146" text-anchor="middle" class="label">Post service</text>

  <rect x="1190" y="105" width="160" height="70" class="store"/>
  <text x="1270" y="136" text-anchor="middle" class="label">Bảng</text>
  <text x="1270" y="158" text-anchor="middle" class="label">posts</text>

  <rect x="70" y="375" width="190" height="70" class="obj"/>
  <text x="165" y="416" text-anchor="middle" class="label">Quản trị viên</text>

  <rect x="350" y="375" width="180" height="70" class="obj"/>
  <text x="440" y="416" text-anchor="middle" class="label">Admin API</text>

  <rect x="620" y="375" width="180" height="70" class="store"/>
  <text x="710" y="406" text-anchor="middle" class="label">Bảng</text>
  <text x="710" y="428" text-anchor="middle" class="label">tags</text>

  <rect x="880" y="375" width="210" height="70" class="store"/>
  <text x="985" y="406" text-anchor="middle" class="label">Bảng</text>
  <text x="985" y="428" text-anchor="middle" class="label">post_tags</text>

  <rect x="1170" y="375" width="190" height="70" class="log"/>
  <text x="1265" y="406" text-anchor="middle" class="label">admin</text>
  <text x="1265" y="428" text-anchor="middle" class="label">audit_logs</text>

  <path d="M240 140 L330 140" class="arrow"/>
  <circle cx="285" cy="118" r="15" class="num-circle"/>
  <text x="285" y="123" text-anchor="middle" class="num-text">1</text>

  <path d="M520 140 L610 140" class="arrow"/>
  <circle cx="565" cy="118" r="15" class="num-circle"/>
  <text x="565" y="123" text-anchor="middle" class="num-text">2</text>

  <path d="M790 140 L880 140" class="arrow"/>
  <circle cx="835" cy="118" r="15" class="num-circle"/>
  <text x="835" y="123" text-anchor="middle" class="num-text">3</text>

  <path d="M1070 140 L1190 140" class="arrow"/>
  <circle cx="1130" cy="118" r="15" class="num-circle"/>
  <text x="1130" y="123" text-anchor="middle" class="num-text">4</text>

  <path d="M920 175 L920 335 L710 335 L710 375" class="arrow"/>
  <circle cx="815" cy="335" r="15" class="num-circle"/>
  <text x="815" y="340" text-anchor="middle" class="num-text">5</text>

  <path d="M975 175 L975 375" class="arrow"/>
  <circle cx="1008" cy="270" r="15" class="num-circle"/>
  <text x="1008" y="275" text-anchor="middle" class="num-text">6</text>

  <path d="M165 375 L165 250 L700 250 L700 175" class="dash"/>
  <circle cx="165" cy="300" r="15" class="num-circle"/>
  <text x="165" y="305" text-anchor="middle" class="num-text">7</text>

  <path d="M260 410 L350 410" class="arrow"/>
  <circle cx="305" cy="388" r="15" class="num-circle"/>
  <text x="305" y="393" text-anchor="middle" class="num-text">8</text>

  <path d="M500 375 L1190 165" class="arrow"/>
  <circle cx="845" cy="270" r="15" class="num-circle"/>
  <text x="845" y="275" text-anchor="middle" class="num-text">9</text>

  <path d="M530 410 L620 410" class="arrow"/>
  <circle cx="575" cy="388" r="15" class="num-circle"/>
  <text x="575" y="393" text-anchor="middle" class="num-text">10</text>

  <path d="M460 445 L460 490 L985 490 L985 445" class="arrow"/>
  <circle cx="723" cy="490" r="15" class="num-circle"/>
  <text x="723" y="495" text-anchor="middle" class="num-text">11</text>

  <path d="M400 445 L400 530 L1265 530 L1265 445" class="arrow"/>
  <circle cx="832" cy="530" r="15" class="num-circle"/>
  <text x="832" y="535" text-anchor="middle" class="num-text">12</text>

  <rect x="70" y="590" width="1290" height="285" class="legend-box"/>
  <text x="95" y="625" class="legend-title">Chú giải luồng thông điệp</text>

  <text x="95" y="662" class="small">1. Sinh viên nhập tiêu đề, nội dung và tag trên giao diện.</text>
  <text x="95" y="692" class="small">2. Giao diện gửi yêu cầu tạo bài viết đến Post API.</text>
  <text x="95" y="722" class="small">3. Post API chuyển dữ liệu cho Post service để kiểm tra và xử lý nghiệp vụ.</text>
  <text x="95" y="752" class="small">4. Post service lưu bài viết vào posts với status=pending và requested_new_tags nếu có.</text>
  <text x="95" y="782" class="small">5. Post service đối chiếu danh sách tag đã tồn tại trong bảng tags.</text>

  <text x="760" y="662" class="small">6. Post service chỉ gắn các tag đã có vào post_tags.</text>
  <text x="760" y="692" class="small">7. Quản trị viên xem danh sách bài viết chờ duyệt.</text>
  <text x="760" y="722" class="small">8. Quản trị viên gửi quyết định duyệt hoặc từ chối bài viết.</text>
  <text x="760" y="752" class="small">9. Admin API cập nhật status=active hoặc status=rejected và xóa requested_new_tags.</text>
  <text x="760" y="782" class="small">10. Khi duyệt, Admin API tạo tag mới được đề xuất nếu chưa tồn tại.</text>
  <text x="760" y="812" class="small">11. Khi duyệt, Admin API gắn tag mới vào post_tags nếu bài chưa có liên kết.</text>
  <text x="760" y="842" class="small">12. Admin API ghi thao tác duyệt hoặc từ chối vào admin_audit_logs.</text>
</svg>
